# markets-mcp: read-only Polymarket + Kalshi odds over MCP (Streamable HTTP at /mcp). Keyless, no secrets.
#   docker compose up -d --build
# Publishes no ports: Calliope's agent reaches it as http://markets-mcp:8000/mcp on realtime-android_default.
services:
  markets-mcp:
    build: .
    image: markets-mcp:latest
    container_name: markets-mcp
    restart: always
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [calliope]
networks:
  calliope:
    name: realtime-android_default
    external: true
